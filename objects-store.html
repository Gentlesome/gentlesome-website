<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gentlesome · 艺术品与周边</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="logo" href="./login.html" aria-label="进入 Gentlesome 个人空间" data-logo="Gentlesome">Gentlesome</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="主导航">
        <a href="./history.html">历史</a>
        <a href="./programs.html">项目</a>
        <a href="./carry-world.html">窗口</a>
        <button type="button" data-open-contact>联系</button>
      </nav>
    </header>

    <main>
      <section class="panel editor-main">
        <div class="editor-intro reveal page-intro">
          <p class="eyebrow">Art Object</p>
          <h1>艺术品与周边</h1>
          <p>让画面中的诗意落入现实，成为可以被收藏、陪伴与携带的对象。</p>
        </div>

        <div class="editor-grid">
          <section class="editor-card reveal" data-editor="objects">
            <h2>可添加或可购买入口</h2>
            <div class="editor-toolbar">
              <button class="ui-btn" type="button" data-add-item>添加条目</button>
            </div>
            <div class="item-list" data-item-list></div>
          </section>
        </div>
      </section>
    </main>

    <div class="contact-modal" data-contact-modal hidden>
      <div class="contact-backdrop" data-close-contact></div>
      <section class="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title">
        <button type="button" class="contact-close" aria-label="关闭" data-close-contact>
          ×
        </button>
        <p class="contact-kicker">Contact Path</p>
        <h2 id="contact-title">微信联系方式</h2>
        <p class="contact-id">Gentles_jin7</p>
      </section>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
