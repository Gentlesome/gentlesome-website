<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gentlesome Personal Space</title>
    <meta
      name="description"
      content="Gentlesome 个人空间登录入口。"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-shell">
        <a
          class="login-brand"
          href="index.html"
          aria-label="返回 Gentlesome 首页"
          data-logo="Gentlesome"
        >Gentlesome</a>

        <div class="login-copy">
          <p class="eyebrow">Personal Space</p>
          <h1>进入你的温柔空间。</h1>
          <p class="lead">
            登录后进入 Gentlesome 的个人空间，
            在这里承接收藏记录、展览预约、活动通知与更私密的品牌内容。
          </p>
        </div>

        <form class="login-card">
          <label class="field">
            <span>邮箱</span>
            <input type="email" name="email" placeholder="name@example.com" />
          </label>

          <label class="field">
            <span>密码</span>
            <input type="password" name="password" placeholder="请输入你的密码" />
          </label>

          <button class="button button-primary" type="button">进入个人空间</button>
          <a class="button button-secondary" href="index.html">回到品牌首页</a>
        </form>
      </section>
    </main>
  </body>
</html>
