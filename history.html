<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gentlesome · 宣言历史成因</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="logo" href="./login.html" aria-label="进入 Gentlesome 个人空间" data-logo="Gentlesome">Gentlesome</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="主导航">
        <a href="./objects-store.html">作品</a>
        <a href="./programs.html">项目</a>
        <a href="./carry-world.html">窗口</a>
        <button type="button" data-open-contact>联系</button>
      </nav>
    </header>

    <main>
      <section class="panel editor-main editor-history">
        <div class="editor-intro reveal page-intro">
          <p class="eyebrow">Manifesto History</p>
          <h1>为了安全，请务必温柔。</h1>
          <p>
            画作未必带来相同的想象，但张嘉通的文字给予了 Gentlesome 最初的理想。
          </p>
        </div>

        <div class="editor-grid">
          <section class="editor-card reveal works-gallery manifesto-combined">
            <figure class="manifesto-artwork">
              <img src="./assets/gentlesome-zhang-jiatong.png" alt="《GENTLESOME》张嘉通作品画面" />
              <figcaption>
                <span class="art-title">《GENTLESOME》</span>
                <span class="art-wish">
                  是一个美好的愿望。愿这个世界变得温柔、可爱，愿新的生命健康、勇敢，充满爱与糖果，愿所有的不堪都变得柔软、滑稽，愿爱不再盲目，美好永远美好。为了安全，请务必温柔。
                </span>
                <span class="art-author">——张嘉通</span>
              </figcaption>
              <div class="manifesto-origin">
                <h2>文字给予了想象</h2>
                <p>
                  作品的画面未必带给我相同的想象，但张嘉通写下的这段话给了 Gentlesome 最初的方向。
                  这也是艺术传播的力量：它让一句愿望越过作品本身，进入现实，并逐渐长成品牌的精神中心。
                </p>
                <p>
                  Gentlesome 从最初的意志形态到如今的存在本身，便是艺术传承的伟大体现。对于精神世界的仰望之旅，我们似乎只能通过或多或少的运气来自我定义；然而如今，我们或许能将它们集结起来，在艺术精神的体验中，坚定我们曾希望的。
                </p>
              </div>
            </figure>
          </section>

          <section class="editor-card reveal spirit-archive" data-editor="spirit">
            <div class="archive-head">
              <div>
                <p class="eyebrow">Spirit Archive</p>
                <h2>精神话语</h2>
              </div>
              <button class="ui-btn" type="button" data-add-item>添加</button>
            </div>
            <div class="item-list spirit-list" data-item-list></div>
          </section>
        </div>
      </section>
    </main>

    <div class="contact-modal" data-contact-modal hidden>
      <div class="contact-backdrop" data-close-contact></div>
      <section class="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title">
        <button type="button" class="contact-close" aria-label="关闭" data-close-contact>
          ×
        </button>
        <p class="contact-kicker">Contact Path</p>
        <h2 id="contact-title">微信联系方式</h2>
        <p class="contact-id">Gentles_jin7</p>
      </section>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
