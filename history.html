<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>Gentlesome · 宣言历史成因</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="logo" href="./index.html" aria-label="返回首页" data-logo="Gentlesome">Gentlesome</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="主导航">
        <a href="./objects-store.html">作品</a>
        <a href="./programs.html">项目</a>
        <a href="./carry-world.html">窗口</a>
        <a href="./index.html#contact">联系</a>
      </nav>
    </header>

    <main>
      <section class="panel editor-main editor-history">
        <div class="editor-intro reveal">
          <p class="eyebrow">Manifesto History</p>
          <h1>为了安全，请务必温柔。</h1>
          <p>
            这句宣言源于张嘉通三幅作品带来的感受，并持续成为 Gentlesome 的精神核心。
          </p>
        </div>

        <div class="editor-grid">
          <section class="editor-card reveal works-gallery">
            <h2>张嘉通 · 三幅作品</h2>
            <div class="works-grid">
              <article class="work-item">
                <div class="work-visual work-visual-a" aria-hidden="true"></div>
                <h3>作品一</h3>
                <p>愿望的起点：关于温柔与被保护感的第一次凝视。</p>
              </article>
              <article class="work-item">
                <div class="work-visual work-visual-b" aria-hidden="true"></div>
                <h3>作品二</h3>
                <p>现实的软化：让不堪变得柔软，情绪有了可安放的位置。</p>
              </article>
              <article class="work-item">
                <div class="work-visual work-visual-c" aria-hidden="true"></div>
                <h3>作品三</h3>
                <p>核心成句：愿爱不再盲目，最终沉淀为品牌宣言。</p>
              </article>
            </div>
            <p class="work-note">注：此处为作品陈列位，可后续替换为真实作品图。</p>
          </section>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
